schema_version: 2
frame: map
units: {pos: m, angles: rad}

entities:
  - id: home
    class: HOME
    aliases: [start, base, reference]
    affordances: [NAV, RETURN]
    description: origin and return reference
    pose:
      position: {x: 0.0, y: 0.0, z: 0.2}
      orientation: {x: 0.0, y: 0.0, z: 0.0, w: 1.0}

  - id: exploration_wall
    class: WALL
    aliases: [wall, obstacle]
    affordances: [AVOID]
    description: finite wall providing observable planar navigation geometry
    pose:
      position: {x: 4.0, y: 0.0, z: 0.55}
      orientation: {x: 0.0, y: 0.0, z: 0.0, w: 1.0}
    extent: [0.5, 5.0, 1.2]

  - id: exploration_return_wall
    class: WALL
    aliases: [return wall, breakwater return]
    affordances: [AVOID]
    description: perpendicular return that makes the live-LiDAR arena observable without enclosing the boat
    pose:
      position: {x: 2.0, y: 2.5, z: 0.35}
      orientation: {x: 0.0, y: 0.0, z: 0.0, w: 1.0}
    extent: [4.0, 0.5, 0.8]

  - id: exploration_south_breakwater
    class: WALL
    aliases: [south breakwater]
    affordances: [AVOID]
    description: range-limited breakwater providing staged geometric visibility
    pose:
      position: {x: -2.5, y: -4.0, z: 0.55}
      orientation: {x: 0.0, y: 0.0, z: 0.0, w: 1.0}
    extent: [7.0, 0.5, 1.2]
