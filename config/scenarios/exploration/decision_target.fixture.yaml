schema_version: 2
frame: map
units: {pos: m, angles: rad}

# This fixture exposes only the declared decision target. Navigation geometry
# continues to come from the live simulated sensors and map.
entities:
  - id: exploration_wall_target
    class: PANEL
    aliases: [inspection wall, target wall]
    affordances: [INSPECT]
    description: west face of the exploration-arena wall
    pose:
      position: {x: 4.0, y: 0.0, z: 0.55}
      orientation: {x: 0.0, y: 0.0, z: 0.0, w: 1.0}
    extent: [0.5, 5.0, 1.2]
    # These vehicle-reference poses provide distinct, comparable sensing routes
    # at approximately equal standoff. MARINER still validates every complete
    # route and terminal pose against the live costmap before commitment.
    reachable_viewpoints:
      - {x: 1.3, y: 0.1, z: 0.55, yaw: -0.03702, standoff_m: 2.702,
         visibility_score: 1.0, reachability_score: 1.0, safety_score: 1.0}
      - {x: 1.3, y: 0.3, z: 0.55, yaw: -0.11066, standoff_m: 2.717,
         visibility_score: 1.0, reachability_score: 1.0, safety_score: 1.0}
      - {x: 1.45, y: 0.2, z: 0.55, yaw: -0.07827, standoff_m: 2.558,
         visibility_score: 1.0, reachability_score: 1.0, safety_score: 1.0}
      - {x: 1.6, y: 0.1, z: 0.55, yaw: -0.04164, standoff_m: 2.402,
         visibility_score: 1.0, reachability_score: 1.0, safety_score: 1.0}
      - {x: 1.6, y: 0.3, z: 0.55, yaw: -0.12435, standoff_m: 2.419,
         visibility_score: 1.0, reachability_score: 1.0, safety_score: 1.0}
    decision_support_area_m2: 6.0
    decision_support_elements_disjoint: true
    decision_support_elements:
      - {id: west_0, x: 3.75, y: -2.0, measure_m2: 1.2}
      - {id: west_1, x: 3.75, y: -1.0, measure_m2: 1.2}
      - {id: west_2, x: 3.75, y: 0.0, measure_m2: 1.2}
      - {id: west_3, x: 3.75, y: 1.0, measure_m2: 1.2}
      - {id: west_4, x: 3.75, y: 2.0, measure_m2: 1.2}
