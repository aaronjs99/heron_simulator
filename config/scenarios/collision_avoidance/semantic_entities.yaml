schema_version: 2
frame: map
units: {pos: m, angles: rad}

entities:
  - id: home
    class: HOME
    aliases: [start, base, reference]
    affordances: [NAV, RETURN]
    description: collision campaign start pose
    pose:
      position: {x: 0.0, y: 0.0, z: 0.2}
      orientation: {x: 0.0, y: 0.0, z: 0.0, w: 1.0}

  - id: center_post
    class: OBSTACLE
    static: true
    aliases: [post, collision post]
    affordances: [AVOID]
    description: exact cylindrical obstacle intersecting the direct start-goal hull sweep
    pose:
      position: {x: 2.75, y: 0.0, z: 0.55}
      orientation: {x: 0.0, y: 0.0, z: 0.0, w: 1.0}
    geometry: {type: cylinder, radius_m: 0.40, height_m: 1.50}

  - id: north_reference_wall
    class: WALL
    static: true
    affordances: [AVOID]
    pose:
      position: {x: 2.5, y: 5.0, z: 0.55}
      orientation: {x: 0.0, y: 0.0, z: 0.0, w: 1.0}
    extent: [12.0, 0.4, 1.2]

  - id: south_reference_wall
    class: WALL
    static: true
    affordances: [AVOID]
    pose:
      position: {x: 2.5, y: -5.0, z: 0.55}
      orientation: {x: 0.0, y: 0.0, z: 0.0, w: 1.0}
    extent: [12.0, 0.4, 1.2]

  - id: west_reference_wall
    class: WALL
    static: true
    affordances: [AVOID]
    pose:
      position: {x: -3.5, y: 0.0, z: 0.55}
      orientation: {x: 0.0, y: 0.0, z: 0.0, w: 1.0}
    extent: [0.4, 10.0, 1.2]

  - id: east_reference_wall
    class: WALL
    static: true
    affordances: [AVOID]
    pose:
      position: {x: 8.5, y: 0.0, z: 0.55}
      orientation: {x: 0.0, y: 0.0, z: 0.0, w: 1.0}
    extent: [0.4, 10.0, 1.2]
