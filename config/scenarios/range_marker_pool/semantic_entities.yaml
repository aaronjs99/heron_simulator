schema_version: 2
frame: map
units: {pos: m, angles: rad}

entities:
  - id: home
    class: HOME
    aliases: [start, base, reference]
    affordances: [NAV, RETURN]
    description: Reference start for synthetic marker characterization
    pose:
      position: {x: 0.0, y: 0.0, z: 0.2}
      orientation: {x: 0.0, y: 0.0, z: 0.0, w: 1.0}

# Marker geometry and placement are intentionally not repeated here. The
# scenario points to the RANGE_AID descriptor and its matching simulator-owned
# placement record.
