# Benchmark simulation thruster profile used by drive_to_thrusters.py.
# Full-scale force follows the legacy Heron simulator's trial-run thrust table
# (33.6 N forward, 19.88 N reverse). Local electrical data informs the
# side/direction onset and current proxies only; it does not identify force.
# Keep this file limited to parameters the active translator reads.
rate: 30.0
cmd_timeout: 0.35
max_fwd_thrust: 33.6
max_bck_thrust: 19.88
forward_current_scale: 1.0
reverse_current_scale: 1.0
# Initial real-run correction: Friday bags showed asymmetric current/yaw and
# residual yaw during coast, while the old sim was perfectly symmetric.
left_scale: 1.0
right_scale: 1.0
response_time_constant_sec: 0.45
max_drive_delta_per_sec: 1.25
nominal_voltage_v: 16.0
simulated_voltage_v: 16.0
direction_change_blank_sec: 0.25
regimes:
  left_forward: {deadband: 0.10, force_exponent: 1.25, max_force_n: 33.6, max_current_a: 6.2, max_rpm: 5500.0, nominal_voltage_v: 16.0, voltage_exponent: 2.0}
  right_forward: {deadband: 0.15, force_exponent: 1.25, max_force_n: 33.6, max_current_a: 6.0, max_rpm: 5500.0, nominal_voltage_v: 16.0, voltage_exponent: 2.0}
  left_reverse: {deadband: 0.15, force_exponent: 1.35, max_force_n: 19.88, max_current_a: 1.3, max_rpm: 5000.0, nominal_voltage_v: 16.0, voltage_exponent: 2.0}
  right_reverse: {deadband: 0.20, force_exponent: 1.35, max_force_n: 19.88, max_current_a: 0.7, max_rpm: 5000.0, nominal_voltage_v: 16.0, voltage_exponent: 2.0}
